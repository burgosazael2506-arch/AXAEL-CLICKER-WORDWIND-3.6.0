<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>AXAEL CLICKER WORDWIND 3.6.0</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c31;--panel2:#1b2741;--line:#2d3b59;--ink:#f5f7ff;--muted:#a9b5cf;--cyan:#55e6e0;--gold:#ffd166;--pink:#ff77b7;--green:#8ef0a2;--shadow:0 20px 55px #0007}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#273d68 0,transparent 45%),linear-gradient(145deg,#0b1020,#11182b 55%,#0b1222);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--cyan),#8d8aff);color:#10152a;font-size:24px;font-weight:1000;box-shadow:0 7px 28px #55e6e044}.brand h1{font-size:clamp(18px,3vw,27px);letter-spacing:.06em;margin:0}.brand small{display:block;color:var(--muted);letter-spacing:.16em;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.quiet,.tab,.buy,.reset{border:1px solid var(--line);background:#ffffff08;border-radius:11px;padding:9px 12px}.quiet:hover,.tab:hover{background:#ffffff12}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:linear-gradient(155deg,#17223aee,#11192bee);border:1px solid #ffffff15;border-radius:20px;box-shadow:var(--shadow)}.main{padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:410px;position:relative;overflow:hidden}.main:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#55e6e011;filter:blur(40px);top:75px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}.score{font-size:clamp(42px,8vw,72px);font-weight:900;letter-spacing:-.05em;margin:4px 0 0;font-variant-numeric:tabular-nums}.score-label{color:var(--muted);font-size:13px}.stats{display:flex;justify-content:center;gap:20px;margin:14px 0;color:var(--muted);font-size:13px}.stats b{color:var(--ink)}.orb-button{position:relative;border:0;background:transparent;padding:0;margin:13px auto 10px;width:170px;height:170px;z-index:1;transition:transform .08s}.orb-button:active{transform:scale(.94)}.orb{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 27%,#fff8 0 3%,transparent 16%),radial-gradient(circle at 36% 30%,#9ffff4,#31a9c9 35%,#6158cf 70%,#302363);box-shadow:inset -14px -20px 35px #111c7c88,inset 10px 12px 28px #fff5,0 0 35px #55e6e055,0 0 90px #7766ff22;animation:float 3s ease-in-out infinite;position:relative}.orb:after{content:"";position:absolute;inset:14px;border:1px solid #ffffff45;border-radius:50%}.orb span{font-size:49px;filter:drop-shadow(0 3px 8px #17223a)}@keyframes float{50%{transform:translateY(-5px)}}.hint{color:var(--muted);font-size:12px}.right{padding:18px;display:flex;flex-direction:column;min-height:410px}.tabs{display:flex;gap:7px;padding-bottom:14px;border-bottom:1px solid #ffffff14;overflow-x:auto;flex-shrink:0}.tab{padding:8px 12px;color:var(--muted);font-size:13px}.tab.active{background:#55e6e01b;border-color:#55e6e066;color:var(--cyan)}.tab-panel{padding-top:12px;overflow:auto;max-height:355px}.promo-form{display:flex;gap:8px;padding:12px 10px}.promo-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;background:#0d1527;color:var(--ink);padding:10px;text-transform:uppercase}.mission-progress{height:5px;background:#ffffff14;border-radius:8px;margin-top:7px;overflow:hidden}.mission-progress i{display:block;height:100%;background:var(--cyan)}.upgrade{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid #ffffff10}.upgrade:last-child{border:0}.icon{width:40px;height:40px;border-radius:12px;background:#ffffff0c;display:grid;place-items:center;font-size:21px}.upgrade h3{font-size:14px;margin:0 0 2px}.upgrade p{margin:0;color:var(--muted);font-size:11px}.price{font-size:11px;color:var(--gold);margin-top:4px}.buy{padding:8px 10px;font-size:12px;min-width:84px;border-color:#55e6e044;background:#55e6e014}.buy:hover:not(:disabled){background:#55e6e02d}.buy:disabled{opacity:.4;cursor:not-allowed}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 0 10px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.achievements{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.achievement{padding:13px;border:1px solid #ffffff13;border-radius:14px;background:#111a2d;opacity:.55;min-height:96px}.achievement.done{opacity:1;border-color:#ffd16666;background:linear-gradient(145deg,#3a301d,#161b2b)}.achievement .aicon{font-size:21px}.achievement h3{font-size:12px;margin:4px 0}.achievement p{font-size:10px;color:var(--muted);margin:0}.notice{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#202d47;border:1px solid #55e6e066;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);transition:.2s;z-index:5}.notice.show{opacity:1;transform:translate(-50%,0)}.float-text{position:absolute;color:var(--gold);font-weight:800;pointer-events:none;animation:rise .8s ease-out forwards;z-index:2;text-shadow:0 2px 8px #000}@keyframes rise{to{transform:translateY(-70px);opacity:0}}.footer{text-align:center;color:#75829e;font-size:11px;margin-top:18px}.reset{color:#ffadad;border-color:#ff777733}.empty{color:var(--muted);text-align:center;padding:36px 12px;font-size:13px}@media(max-width:760px){.hero{grid-template-columns:1fr}.main,.right{min-height:unset}.tab-panel{max-height:390px}.achievements{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.wrap{width:calc(100% - 18px);padding-top:16px}.top{align-items:flex-start}.actions{max-width:135px;justify-content:flex-end}.quiet{padding:8px;font-size:11px}.main{padding:20px 12px}.orb-button{width:150px;height:150px}.achievements{gap:7px}.achievement{padding:10px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><div class="logo">✦</div><div><h1 id="playerName">AXAEL CLICKER</h1><small>WORDWIND · EDICIÓN 3.6.0</small></div></div><div class="actions"><button class="quiet" id="soundBtn" type="button" aria-pressed="false">🔇 Sonido</button><button class="quiet" id="saveBtn" type="button">💾 Guardar</button><button class="reset" id="resetBtn" type="button">Reiniciar</button></div></header>
  <section class="hero"><div class="card main" id="mainCard"><div class="eyebrow">Energía reunida</div><div class="score" id="score">0</div><div class="score-label">fragmentos de Wordwind</div><div class="stats"><span>⚡ <b id="perClick">1</b> / toque</span><span>⏱ <b id="perSec">0</b> / segundo</span></div><button class="orb-button" id="clicker" type="button" aria-label="Recolectar fragmentos"><div class="orb"><span id="coreIcon">✦</span></div></button><div class="hint">Toca el núcleo para recolectar energía</div></div>
    <div class="card right"><nav class="tabs" aria-label="Tienda y funciones"><button class="tab active" data-tab="upgrades" type="button">Mejoras</button><button class="tab" data-tab="market" type="button">Mercado negro</button><button class="tab" data-tab="pets" type="button">Mascotas</button><button class="tab" data-tab="missions" type="button">Misiones</button><button class="tab" data-tab="codes" type="button">Códigos</button><button class="tab" data-tab="custom" type="button">Personalizar</button><button class="tab" data-tab="milestones" type="button">Hitos</button><button class="tab" data-tab="stats" type="button">Estadísticas</button></nav><div class="tab-panel" id="tabPanel"></div></div></section>
  <section class="section"><div class="section-head"><h2>Logros</h2><span id="achievementCount">0 / 8 desbloqueados</span></div><div class="achievements" id="achievements"></div></section>
  <div class="footer">La partida se guarda automáticamente en este navegador. Sin conexión ni cuenta.</div>
</main><div class="notice" id="notice" role="status"></div>
<script>
(()=>{'use strict';
const KEY='axael-clicker-wordwind-360';
const upgrades=[
 {id:'spark',name:'Chispa',icon:'✨',desc:'+1 fragmento por toque',base:15,kind:'click',power:1},
 {id:'glove',name:'Guante de cometa',icon:'🧤',desc:'+5 fragmentos por toque',base:100,kind:'click',power:5},
 {id:'echo',name:'Eco estelar',icon:'🌟',desc:'+1 fragmento por segundo',base:50,kind:'auto',power:1},
 {id:'drone',name:'Dron recolector',icon:'🛸',desc:'+5 fragmentos por segundo',base:250,kind:'auto',power:5},
 {id:'portal',name:'Portal Wordwind',icon:'🌀',desc:'+25 fragmentos por segundo',base:1200,kind:'auto',power:25},
 {id:'autoclick',name:'Auto clicker',icon:'🖱️',desc:'+1 toque automático por segundo',base:300,kind:'autoclick',power:1},
 {id:'nova',name:'Núcleo de nova',icon:'💠',desc:'Duplica tu fuerza por toque',base:5000,kind:'multi',power:2}
];
const achievements=[
 {id:'first',icon:'🌱',name:'Primer destello',desc:'Consigue 1 fragmento.',test:s=>s.total>=1},
 {id:'hundred',icon:'💯',name:'Cien y contando',desc:'Consigue 100 fragmentos.',test:s=>s.total>=100},
 {id:'thousand',icon:'🌠',name:'Lluvia estelar',desc:'Consigue 1.000 fragmentos.',test:s=>s.total>=1000},
 {id:'tenk',icon:'🚀',name:'Despegue',desc:'Consigue 10.000 fragmentos.',test:s=>s.total>=10000},
 {id:'clicks',icon:'👆',name:'Manos rápidas',desc:'Haz 100 toques.',test:s=>s.clicks>=100},
 {id:'shop',icon:'🛍️',name:'A primera compra',desc:'Compra una mejora.',test:s=>s.purchases>=1},
 {id:'collector',icon:'🤖',name:'Automatizado',desc:'Llega a 10 por segundo.',test:s=>rate(s)>=10},
 {id:'rich',icon:'👑',name:'Leyenda Wordwind',desc:'Consigue 100.000 fragmentos.',test:s=>s.total>=100000}
];
const fresh=()=>({score:0,total:0,clicks:0,purchases:0,levels:{},multiplier:1,unlocked:[],sound:false,last:Date.now(),playerName:'AXAEL CLICKER',themeColor:'#55e6e0',coreIcon:'✦',blackBought:{},pets:[],activePet:'',claimedMissions:[],redeemedCodes:[],blackAuto:0,blackClick:1});let state;
try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')};state.levels=state.levels||{};state.unlocked=state.unlocked||[]}catch{state=fresh()}
state.playerName=state.playerName||'AXAEL CLICKER';state.themeColor=state.themeColor||'#55e6e0';state.coreIcon=state.coreIcon||'✦';
const $=id=>document.getElementById(id);const fmt=n=>{if(n<1000)return Math.floor(n).toLocaleString('es');const units=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n<10?1:0)+units[i]};
let rate=s=>upgrades.filter(u=>u.kind==='auto').reduce((a,u)=>a+(s.levels[u.id]||0)*u.power,0);
let clickPower=s=>Math.round((1+upgrades.filter(u=>u.kind==='click').reduce((a,u)=>a+(s.levels[u.id]||0)*u.power,0))*s.multiplier);
const price=(u,s)=>Math.floor(u.base*Math.pow(1.16,s.levels[u.id]||0));let toastTimer;
function toast(msg){const el=$('notice');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function save(show=false){state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));if(show)toast('Partida guardada.')}catch{if(show)toast('El navegador no permite guardar en este modo.')}}
function checkAchievements(){for(const a of achievements)if(!state.unlocked.includes(a.id)&&a.test(state)){state.unlocked.push(a.id);toast('Logro desbloqueado: '+a.name+'!');renderAchievements()}}
function renderAchievements(){$('achievements').innerHTML=achievements.map(a=>{const ok=state.unlocked.includes(a.id);return `<article class="achievement ${ok?'done':''}"><div class="aicon">${ok?a.icon:'🔒'}</div><h3>${a.name}</h3><p>${a.desc}</p></article>`}).join('');$('achievementCount').textContent=`${state.unlocked.length} / ${achievements.length} desbloqueados`}
function render(){ $('score').textContent=fmt(state.score);$('perClick').textContent=fmt(clickPower(state));$('perSec').textContent=fmt(rate(state));renderAchievements();const tab=document.querySelector('.tab.active')?.dataset.tab||'upgrades';if(tab!=='custom')renderPanel(tab) }
function renderPanel(tab){const el=$('tabPanel');if(tab==='upgrades'){el.innerHTML=upgrades.map(u=>{const cost=price(u,state),level=state.levels[u.id]||0;return `<div class="upgrade"><div class="icon">${u.icon}</div><div><h3>${u.name} <span style="color:var(--muted);font-weight:400">Nv. ${level}</span></h3><p>${u.desc}</p><div class="price">🟡 ${fmt(cost)} fragmentos</div></div><button class="buy" data-buy="${u.id}" ${state.score<cost?'disabled':''}>Comprar</button></div>`}).join('')}
else if(tab==='milestones'){const rows=[1,10,25,50,100,250,500,1000].map(n=>{const got=state.clicks>=n;return `<div class="upgrade"><div class="icon">${got?'✅':'🎯'}</div><div><h3>${n} toques</h3><p>${got?'Hito alcanzado':'Sigue tocando el núcleo'}</p></div><span style="color:${got?'var(--green)':'var(--muted)'}">${got?'Listo':Math.min(100,Math.floor(state.clicks/n*100))+'%'}</span></div>`}).join('');el.innerHTML=rows}
else{el.innerHTML=`<div class="upgrade"><div class="icon">👆</div><div><h3>Toques realizados</h3><p>Tu energía manual</p></div><b>${fmt(state.clicks)}</b></div><div class="upgrade"><div class="icon">🛒</div><div><h3>Mejoras compradas</h3><p>Niveles totales</p></div><b>${fmt(state.purchases)}</b></div><div class="upgrade"><div class="icon">⚡</div><div><h3>Producción automática</h3><p>Fragmentos cada segundo</p></div><b>${fmt(rate(state))}/s</b></div><div class="upgrade"><div class="icon">✦</div><div><h3>Multiplicador</h3><p>Potencia de cada toque</p></div><b>×${state.multiplier}</b></div><div class="empty">Progreso total: ${fmt(state.total)} fragmentos</div>`}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderPanel(b.dataset.tab)}));
$('tabPanel').addEventListener('click',e=>{const id=e.target.closest('[data-buy]')?.dataset.buy;if(!id)return;const u=upgrades.find(x=>x.id===id),cost=price(u,state);if(state.score<cost)return;state.score-=cost;state.levels[id]=(state.levels[id]||0)+1;state.purchases++;if(u.kind==='multi')state.multiplier*=u.power;checkAchievements();save();render()});
$('clicker').addEventListener('click',e=>{const power=clickPower(state);state.score+=power;state.total+=power;state.clicks++;const r=$('mainCard').getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;const floater=document.createElement('span');floater.className='float-text';floater.textContent='+'+fmt(power);floater.style.left=(x-r.left)+'px';floater.style.top=(y-r.top)+'px';$('mainCard').appendChild(floater);setTimeout(()=>floater.remove(),850);checkAchievements();render();if(state.sound)beep()});
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);o.onended=()=>c.close()}catch{}}
$('soundBtn').addEventListener('click',()=>{state.sound=!state.sound;$('soundBtn').textContent=state.sound?'🔊 Sonido':'🔇 Sonido';$('soundBtn').setAttribute('aria-pressed',String(state.sound));save()});$('saveBtn').addEventListener('click',()=>save(true));$('resetBtn').addEventListener('click',()=>{if(confirm('¿Reiniciar todo el progreso de AXAEL CLICKER? Esta acción no se puede deshacer.')){state=fresh();save();render();toast('Progreso reiniciado.')}});
// Extra systems for the expanded Wordwind build.
state.blackBought=state.blackBought||{};state.pets=state.pets||[];state.activePet=state.activePet||'';state.claimedMissions=state.claimedMissions||[];state.redeemedCodes=state.redeemedCodes||[];
const petsCatalog=[{id:'comet',name:'Cometa',icon:'☄️',cost:350,bonus:'+10% por toque',click:1.1,auto:1},{id:'luna',name:'Luna',icon:'🐈',cost:1800,bonus:'+20% producción automática',click:1,auto:1.2},{id:'draco',name:'Draco',icon:'🐉',cost:9000,bonus:'+35% a todo',click:1.35,auto:1.35},{id:'puff',name:'Puff',icon:'🐲',cost:40000,bonus:'+60% a todo',click:1.6,auto:1.6}];
const blackDeals=[{id:'blackboost',name:'Catalizador oscuro',icon:'🧪',desc:'Multiplica tus toques ×2',cost:2500,kind:'click'}, {id:'blackauto',name:'Motor de vacío',icon:'🕳️',desc:'Añade +50 por segundo',cost:6000,kind:'auto'}, {id:'blackjackpot',name:'Cofre clandestino',icon:'🎁',desc:'Obtén 12.000 fragmentos',cost:4000,kind:'cash'}];
const missions=[{id:'m_clicks',name:'Dedos de fuego',desc:'Haz 50 toques',goal:50,reward:400,test:()=>state.clicks},{id:'m_earn',name:'Cosecha estelar',desc:'Reúne 2.000 fragmentos en total',goal:2000,reward:800,test:()=>state.total},{id:'m_buy',name:'Apuesta por crecer',desc:'Compra 5 mejoras',goal:5,reward:700,test:()=>state.purchases},{id:'m_pet',name:'Mejor amigo',desc:'Adopta una mascota',goal:1,reward:1000,test:()=>state.pets.length}];
const promoCodes={'AXAEL360':500,'WORDWIND':2500,'NUCLEO':10000};
function petFactor(which){const pet=petsCatalog.find(p=>p.id===state.activePet);return pet?(pet[which]||1):1}
const autoClicks=s=>(s.levels.autoclick||0);
rate=s=>Math.floor(upgrades.filter(u=>u.kind==='auto').reduce((a,u)=>a+(s.levels[u.id]||0)*u.power,0)*petFactor('auto'))+(s.blackAuto||0)+autoClicks(s)*clickPower(s);
clickPower=s=>Math.round((1+upgrades.filter(u=>u.kind==='click').reduce((a,u)=>a+(s.levels[u.id]||0)*u.power,0))*s.multiplier*petFactor('click')*(s.blackClick||1));
function renderPanel(tab){const el=$('tabPanel');if(tab==='market'){const day=Math.floor(Date.now()/86400000);el.innerHTML=`<div class="empty" style="padding:8px">🕶️ Ofertas del día · se renuevan en el próximo día</div>`+blackDeals.map(d=>`<div class="upgrade"><div class="icon">${d.icon}</div><div><h3>${d.name}</h3><p>${d.desc}</p><div class="price">🟡 ${fmt(d.cost)} fragmentos</div></div><button class="buy" data-deal="${d.id}" ${state.score<d.cost||state.blackBought[d.id+'_'+day]?'disabled':''}>${state.blackBought[d.id+'_'+day]?'Agotado':'Comprar'}</button></div>`).join('')}
else if(tab==='pets'){el.innerHTML=`<div class="empty" style="padding:8px">Equipa una mascota para activar su bono. Una mascota activa a la vez.</div>`+petsCatalog.map(p=>{const owned=state.pets.includes(p.id),active=state.activePet===p.id;return `<div class="upgrade"><div class="icon">${p.icon}</div><div><h3>${p.name} ${active?'<span class="tag">Activa</span>':''}</h3><p>${p.bonus}</p><div class="price">${owned?'Ya adoptada':'🟡 '+fmt(p.cost)+' fragmentos'}</div></div><button class="buy" data-pet="${p.id}" ${!owned&&state.score<p.cost?'disabled':''}>${active?'Equipada':owned?'Equipar':'Adoptar'}</button></div>`}).join('')}
else if(tab==='missions'){el.innerHTML=missions.map(m=>{const progress=Math.min(m.goal,m.test()),claimed=state.claimedMissions.includes(m.id),done=progress>=m.goal;return `<div class="upgrade"><div class="icon">${claimed?'✅':'📜'}</div><div><h3>${m.name}</h3><p>${m.desc} · recompensa ${fmt(m.reward)}</p><div class="mission-progress"><i style="width:${Math.floor(progress/m.goal*100)}%"></i></div></div><button class="buy" data-mission="${m.id}" ${!done||claimed?'disabled':''}>${claimed?'Listo':done?'Cobrar':fmt(progress)+'/'+fmt(m.goal)}</button></div>`}).join('')}
else if(tab==='codes'){el.innerHTML=`<div class="empty" style="padding:12px">Canjea un código promocional. Estos códigos vienen incluidos en esta edición sin conexión.</div><form class="promo-form" id="promoForm"><input id="promoInput" maxlength="24" autocomplete="off" placeholder="ESCRIBE TU CÓDIGO" aria-label="Código promocional"><button class="buy" type="submit">Canjear</button></form><div class="empty" style="padding:8px">Códigos de esta edición: AXAEL360 · WORDWIND · NUCLEO</div><div id="codeHistory"></div>`;$('codeHistory').innerHTML=(state.redeemedCodes||[]).map(c=>`<div class="upgrade"><div class="icon">🎟️</div><div><h3>${c}</h3><p>Código canjeado</p></div><span class="tag">Usado</span></div>`).join('');$('promoForm').addEventListener('submit',e=>{e.preventDefault();const code=$('promoInput').value.trim().toUpperCase();if(!code)return;if(state.redeemedCodes.includes(code)){toast('Ese código ya fue canjeado.');return}if(!Object.hasOwn(promoCodes,code)){toast('Código no válido en esta edición.');return}const reward=promoCodes[code];state.score+=reward;state.total+=reward;state.redeemedCodes.push(code);checkAchievements();save();render();toast(`Código canjeado: +${fmt(reward)} fragmentos.`)})}
else if(tab==='upgrades'){el.innerHTML=upgrades.map(u=>{const cost=price(u,state),level=state.levels[u.id]||0;return `<div class="upgrade"><div class="icon">${u.icon}</div><div><h3>${u.name} <span style="color:var(--muted);font-weight:400">Nv. ${level}</span></h3><p>${u.desc}</p><div class="price">🟡 ${fmt(cost)} fragmentos</div></div><button class="buy" data-buy="${u.id}" ${state.score<cost?'disabled':''}>Comprar</button></div>`}).join('')}
else if(tab==='custom'){const colors=['#55e6e0','#ff77b7','#ffd166','#8ef0a2','#a78bfa','#ff8a5b'],icons=['✦','🌙','🔥','💎','🌀','⭐','🐉','⚡'];el.innerHTML=`<div class="empty" style="padding:8px">Dale tu estilo a Wordwind. Tus cambios se guardan automáticamente.</div><div class="upgrade"><div class="icon">📝</div><div><h3>Nombre del juego</h3><p>Personaliza el título que aparece arriba</p></div></div><form class="promo-form" id="nameForm"><input id="nameInput" maxlength="24" value="${state.playerName.replace(/[&<>\"]/g,'')}" aria-label="Nombre del juego"><button class="buy">Guardar</button></form><div class="upgrade"><div class="icon">🎨</div><div><h3>Color de acento</h3><p>Elige el brillo de la interfaz</p></div></div><div style="display:flex;gap:10px;justify-content:center;padding:10px">${colors.map(c=>`<button type="button" data-color="${c}" aria-label="Color ${c}" style="width:34px;height:34px;border-radius:50%;border:2px solid ${state.themeColor===c?'white':'#ffffff33'};background:${c}"></button>`).join('')}</div><div class="upgrade"><div class="icon">🔮</div><div><h3>Aspecto del núcleo</h3><p>Selecciona el símbolo central</p></div></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px">${icons.map(i=>`<button type="button" data-core="${i}" class="quiet" style="font-size:20px;border-color:${state.coreIcon===i?'var(--cyan)':'var(--line)'}">${i}</button>`).join('')}</div>`;$('nameForm').addEventListener('submit',e=>{e.preventDefault();state.playerName=$('nameInput').value.trim()||'AXAEL CLICKER';applyLook();save();toast('Nombre actualizado.')})}
else if(tab==='milestones'){el.innerHTML=[1,10,25,50,100,250,500,1000].map(n=>{const ok=state.clicks>=n;return `<div class="upgrade"><div class="icon">${ok?'✅':'🎯'}</div><div><h3>${n} toques</h3><p>${ok?'Hito alcanzado':'Sigue tocando el núcleo'}</p></div><span>${ok?'Listo':Math.min(100,Math.floor(state.clicks/n*100))+'%'}</span></div>`}).join('')}
else{el.innerHTML=`<div class="upgrade"><div class="icon">👆</div><div><h3>Toques realizados</h3><p>Tu energía manual</p></div><b>${fmt(state.clicks)}</b></div><div class="upgrade"><div class="icon">🛒</div><div><h3>Mejoras compradas</h3><p>Niveles totales</p></div><b>${fmt(state.purchases)}</b></div><div class="upgrade"><div class="icon">⚡</div><div><h3>Producción automática</h3><p>Fragmentos cada segundo</p></div><b>${fmt(rate(state))}/s</b></div><div class="upgrade"><div class="icon">🐾</div><div><h3>Mascota activa</h3><p>${petsCatalog.find(p=>p.id===state.activePet)?.name||'Ninguna'}</p></div><b>×${petFactor('click').toFixed(2)}</b></div><div class="empty">Progreso total: ${fmt(state.total)} fragmentos</div>`}}
function render(){ $('score').textContent=fmt(state.score);$('perClick').textContent=fmt(clickPower(state));$('perSec').textContent=fmt(rate(state));renderAchievements();renderPanel(document.querySelector('.tab.active')?.dataset.tab||'upgrades') }
function applyLook(){document.documentElement.style.setProperty('--cyan',state.themeColor);$('playerName').textContent=state.playerName;$('coreIcon').textContent=state.coreIcon}
$('tabPanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.color){state.themeColor=b.dataset.color;applyLook();save();renderPanel('custom')}if(b.dataset.core){state.coreIcon=b.dataset.core;applyLook();save();renderPanel('custom')}const day=Math.floor(Date.now()/86400000);if(b.dataset.deal){const d=blackDeals.find(x=>x.id===b.dataset.deal);if(!d||state.score<d.cost||state.blackBought[d.id+'_'+day])return;state.score-=d.cost;state.blackBought[d.id+'_'+day]=true;if(d.kind==='click')state.blackClick=(state.blackClick||1)*2;if(d.kind==='auto')state.blackAuto=(state.blackAuto||0)+50;if(d.kind==='cash'){state.score+=12000;state.total+=12000}state.purchases++;checkAchievements();save();render();toast('Compra del mercado negro completada.')}if(b.dataset.pet){const p=petsCatalog.find(x=>x.id===b.dataset.pet);if(!p)return;if(!state.pets.includes(p.id)){if(state.score<p.cost)return;state.score-=p.cost;state.pets.push(p.id);state.purchases++}state.activePet=p.id;checkAchievements();save();render();toast(p.name+' ahora te acompaña.')}if(b.dataset.mission){const m=missions.find(x=>x.id===b.dataset.mission);if(!m||state.claimedMissions.includes(m.id)||m.test()<m.goal)return;state.claimedMissions.push(m.id);state.score+=m.reward;state.total+=m.reward;checkAchievements();save();render();toast(`Misión completada: +${fmt(m.reward)} fragmentos.`)}});
// Restore up to two hours of passive production while the page was closed.
const away=Math.min(7200,Math.max(0,(Date.now()-(state.last||Date.now()))/1000));if(away>2&&rate(state)>0){const earned=rate(state)*away;state.score+=earned;state.total+=earned;toast(`Bienvenido: +${fmt(earned)} fragmentos mientras no estabas.`)}
setInterval(()=>{const n=rate(state),taps=autoClicks(state);if(n){state.score+=n;state.total+=n;state.clicks+=taps;checkAchievements();render()}},1000);setInterval(()=>save(),10000);window.addEventListener('beforeunload',()=>save());$('soundBtn').textContent=state.sound?'🔊 Sonido':'🔇 Sonido';$('soundBtn').setAttribute('aria-pressed',String(state.sound));applyLook();render();
})();
</script>
</body>

<div id="axaelVisitorCounter" style="
  position:fixed;
  bottom:12px;
  right:12px;
  z-index:9999;
  background:#10172b;
  color:white;
  border:1px solid #6575ff;
  border-radius:12px;
  padding:12px 16px;
  font-family:Arial,sans-serif;
  font-weight:bold;
  box-shadow:0 4px 18px #0008;
">
  🌎 VISITAS TOTALES:
  <span id="axaelVisits">Cargando...</span>
</div>

<script>
(async function () {
  const key = "axael-clicker-wordwind-360-visitas-ecuador-2026";
  const base = "https://countapi.mileshilliard.com/api/v1/";
  const display = document.getElementById("axaelVisits");

  try {
    const counted = sessionStorage.getItem("axael_visit_counted");

    const response = await fetch(
      base + (counted ? "get/" : "hit/") + key
    );

    if (!response.ok) throw new Error("Contador no disponible");

    const data = await response.json();

    sessionStorage.setItem("axael_visit_counted", "yes");
    display.textContent = Number(data.value).toLocaleString("es-EC");
  } catch (error) {
    display.textContent = "No disponible";
    console.error("Error del contador:", error);
  }
})();
</script>
</html>
